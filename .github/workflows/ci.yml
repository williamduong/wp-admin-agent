name: Free plugin CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.18.0'
          cache: npm
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high
      - name: Lint frontend
        run: npm run lint
      - name: Test frontend
        run: npm run test:js
      - name: Build frontend
        run: npm run build
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Audit PHP dependencies
        run: composer audit
      - name: Check PHP syntax
        shell: bash
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Build installable ZIP
        shell: pwsh
        run: ./scripts/package-free.ps1
      - name: Extract installable plugin for WordPress.org checks
        shell: bash
        run: |
          mkdir -p build
          unzip -q "$(find dist -maxdepth 1 -name 'william-research-admin-agent-*.zip' -print -quit)" -d build
      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1
        with:
          build-dir: './build/william-research-admin-agent'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: william-research-admin-agent
          path: dist/*.zip

  php-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        multisite: ['false', 'true']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Install WordPress test suite
        shell: bash
        run: bash tests/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest ${{ matrix.multisite }}
      - name: Run PHP integration tests
        run: vendor/bin/phpunit -c phpunit.xml.dist --testsuite integration

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Run browser end-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
